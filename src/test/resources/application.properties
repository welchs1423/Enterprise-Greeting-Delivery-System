# ---------------------------------------------------------------------------
# EGDS Test Configuration
# Overrides main application.properties for all test executions.
# ---------------------------------------------------------------------------

# --- H2 (Oracle-compatibility mode) ---
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=Oracle;NON_KEYWORDS=VALUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# spring.embedded.kafka.brokers is set automatically by @EmbeddedKafka before context load.
# Falls back to localhost:9092 for tests that do not use @EmbeddedKafka.
spring.kafka.bootstrap-servers=${spring.embedded.kafka.brokers:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.group-id=egds-test-consumer-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.egds.messaging,com.egds.cqrs.event
spring.kafka.consumer.properties.spring.json.value.default.type=com.egds.messaging.GreetingEvent

# --- Cache (in-memory, no Redis required) ---
spring.cache.type=simple

# --- JWT ---
egds.security.jwt.secret=test-secret-key-for-junit-egds-system-minimum-256-bits
egds.security.jwt.expiration=3600000

# --- Kafka Topics ---
egds.kafka.topic.greeting=egds.greeting.events.test
egds.kafka.topic.greeting-requested=egds.greeting.requested.test

# --- Resilience4j: circuit breaker must evaluate after 6 calls in tests ---
resilience4j.circuitbreaker.instances.consoleOutput.minimum-number-of-calls=6

# H2 console disabled in test
spring.h2.console.enabled=false

# GrpcServerSecurityAutoConfiguration excluded (same reason as main application.properties)
spring.autoconfigure.exclude=net.devh.boot.grpc.server.autoconfigure.GrpcServerSecurityAutoConfiguration

# --- Actuator (test) ---
management.endpoints.web.exposure.include=health,prometheus,info
management.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# Disable readiness group CB indicators in tests to avoid missing bean errors
# when Kafka CBs have not yet recorded a sample.
management.endpoint.health.group.readiness.include=readinessState

# --- Tracing (test) ---
# Sample all requests in tests for full Span coverage.
management.tracing.sampling.probability=1.0
spring.application.name=egds-test

# --- gRPC Server (network listener disabled; no in-process-name set globally) ---
# in-process-name is set only in GreetingGrpcServiceIntegrationTest via @SpringBootTest(properties)
# to prevent the name-already-registered conflict when multiple contexts start in the same JVM.
grpc.server.port=-1

# --- gRPC Client ---
# address=in-process:test is intentionally kept here: the channel is created lazily and is only
# exercised by GreetingGrpcServiceIntegrationTest, which also starts the matching in-process server.
grpc.client.egds-greeting-service.address=in-process:test
grpc.client.egds-greeting-service.negotiation-type=plaintext

# --- Phase 8: Chaos Engineering ---
# Disabled in tests to prevent random InterruptedException or 5-second latency.
egds.chaos.enabled=false

# --- Phase 14: Kafka Chaos Monkey ---
# Drop probability set to 0.0 to prevent flaky Kafka integration tests.
egds.chaos.kafka.drop-probability=0.0

# --- Phase 14: Scrum Standup ---
# Standup duration set to 0 to skip the 2-second block in tests.
egds.scrum.standup.duration-ms=0

# --- Phase 17: Labor Union Strike ---
# Disabled in tests to prevent 15% probabilistic HTTP 451 responses.
egds.labor.strike.enabled=false

# --- Phase 18: Subcontractor Blame Delegator ---
# Disabled in tests to prevent 30% probabilistic SubcontractorFailureException.
egds.subcontractor.enabled=false

# --- Phase 18: Poison Pill Takeover Defense ---
# Disabled in tests to prevent heap allocation triggered by request bursts.
egds.poison.pill.enabled=false

# --- Phase 19: ESG Greenwashing Interceptor ---
# Disabled in tests to prevent 2-second per-request latency.
egds.esg.greenwashing.enabled=false

# --- Phase 19: CEO's Nephew Primary Provider ---
# Disabled in tests to ensure deterministic greeting content.
egds.nepotism.enabled=false

# --- Phase 20: McKinsey Consulting Proxy ---
# Disabled in tests to suppress 1000 ms per-request delay.
egds.consulting.enabled=false

# --- Phase 20: RTO Geofence Filter ---
# Disabled in tests to prevent blanket HTTP 403 rejections.
egds.rto.enabled=false

# --- Phase 21: GenAI Hallucination Decorator ---
# Disabled in tests to ensure deterministic greeting content.
egds.genai.hallucination.enabled=false

# --- Phase 21: Vendor Lock-In DRM Filter ---
# Disabled in tests to prevent watermark injection in integration tests.
egds.drm.enabled=false

# --- Phase 24: Greeting Lootbox (Gacha) ---
# Disabled in tests to ensure deterministic "Hello, World!" content.
egds.lootbox.enabled=false

# --- Phase 24: Unskippable Ad Filter ---
# Disabled in tests to prevent 5-second per-request latency.
egds.ads.enabled=false

# --- Phase 24: ToS Dark Pattern Filter ---
# Disabled in tests to prevent HTTP 451 rejections on all requests.
egds.tos.enabled=false

# --- Phase 25: Distributed Letter Assembler ---
# Disabled in tests to prevent parallel CompletableFuture latency (50-200ms per char).
egds.msa.assembler.enabled=false

# --- Phase 25: Enterprise Chaos Monkey (per-letter) ---
# Disabled in tests alongside assembler; chaos is only invoked from the assembler.
egds.msa.chaos.enabled=false

# --- Phase 26: RTO Enforcement Filter ---
# Disabled in tests to prevent HTTP 403 rejections from non-intranet CI runners.
egds.rto.enforcement.enabled=false

# --- Phase 26: Mouse Jiggler Detector ---
# Disabled in tests to prevent timing-dependent HTTP 429 false positives.
egds.surveillance.jiggler.enabled=false

# --- Phase 26: Productivity Score Interceptor ---
# Disabled in tests to suppress non-deterministic X-Employee-Productivity-Score headers.
egds.surveillance.productivity.enabled=false

# --- MongoDB: Flapdoodle embedded MongoDB version ---
de.flapdoodle.mongodb.embedded.version=7.0.12

# --- AI / TensorFlow: fast-fail timeouts to prevent integration test hangs ---
# OpenAI placeholder key returns 401 or times out; short timeout avoids 10s+ waits.
egds.ai.timeout-ms=500
# TensorFlow delay disabled so pipeline completes in milliseconds.
egds.tensorflow.max-predicted-delay-ms=0
